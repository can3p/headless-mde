name: Site

# Builds the project site (site/ and docs/) and deploys it to GitHub Pages.
# The release workflow calls it with the release tag once the package is published, so the site always runs
# the version that is on npm. It can also be run by hand from the Actions tab, for a branch or a tag.

on:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or commit to build the site from
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build the site from (empty for the one selected above)
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build:site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
