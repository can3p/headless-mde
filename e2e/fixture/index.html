<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>headless-mde browser fixture</title>
        <style>
            /* fixed metrics: 20px lines, 10 visible lines, so scroll assertions are deterministic */
            body {
                margin: 0;
                padding: 8px;
            }
            textarea {
                display: block;
                box-sizing: content-box;
                width: 600px;
                height: 200px;
                margin: 0;
                padding: 0;
                border: 0;
                outline: 1px solid #888;
                resize: none;
                font: 16px/20px monospace;
                white-space: pre;
                overflow: auto;
            }
            /* ?wrap=1: wrapped lines, padding and a border, like a typical comment box */
            body.wrap textarea {
                white-space: pre-wrap;
                padding: 6px 10px;
                border: 2px solid #888;
                width: 400px;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="./main.js"></script>
    </body>
</html>
